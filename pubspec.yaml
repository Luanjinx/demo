name: nexstream_tv
description: "Nexstream Android TV Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Network
  provider: ^6.1.2
  dio: ^5.7.0

  # UI, Fonts & Images
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  smooth_page_indicator: ^1.2.0
  carousel_slider: ^5.0.0

  # TV Media Player & System
  video_player: ^2.9.2
  chewie: ^1.8.5
  wakelock_plus: ^1.2.8

  # TV Login (QR Code display on TV)
  qr_flutter: ^4.1.0

  # Utilities & Storage
  shared_preferences: ^2.3.2
  intl: any
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/appicon/
